[project]
name = "job-intel-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "celery>=5.4.0",
    "redis>=5.0.0",
    "openai>=1.30.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "firecrawl-py>=0.0.16",
    "tavily-python>=0.3.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.0",
    "httpx>=0.27.0",
    "bcrypt>=5.0.0",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.2.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
